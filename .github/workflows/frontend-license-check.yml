name: Frontend License Check

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  frontend:
    name: Frontend License Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate third-party license file
        run: pnpm licenses:frontend

      - name: Check diff
        run: |
          git add .
          git diff --cached --exit-code -- src-tauri/licenses/frontend-licenses.json
